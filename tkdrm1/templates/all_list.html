{% extends "base.html" %}
 {% block content %}
  <table class="table">
    <thead>
      <tr class="table-danger">
        <th scope="col">Номер</th>
        <th scope="col">Название</th>
        <th scope="col">Номер</th>
        <th scope="col">Подробнее</th>
      </tr>
    </thead>
    <tbody>
      {% for dev in page_obj.object_list %}
        <tr class="table-danger">
          <th scope="row" class="text-danger">{{ dev.id }}</th>
          <td scope="row" class="text-danger">{{ dev.type.title }}</td>
          <td scope="row" class="text-danger">{{ dev.serial }}</td>
          <td class="text-danger"><a class="mt-3 regular-link" href="{% url 'core:dev_detail' dev.id %}">Тыц</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% include "includes/paginator.html" %}
{% endblock %}
